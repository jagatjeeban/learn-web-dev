<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Navbars</title>
        <style>
            body {
                margin: 0px;
                padding: 20px;
                background-color: #202020;
            }
            h2 {
                color: #fff;
            }
            .nav-container {
                margin: 0px;
                padding: 0px;
            }
            .nav2 {
                background-color: #03643c;
                width: 200px;
                padding: 20px;
            }
            .nav2 ul {
                list-style-type: none;
                margin: 0px;
                padding: 0px;
            }
            .nav2 li {
                margin-bottom: 12px;
            }
            .nav2 a {
                text-decoration: none;
                color: #ffffff;
                display: block;
                width: 100%;
                padding: 10px;
            }
            .nav2 a:hover {
                background-color: #137e0a;
                border-radius: 6px;
            }
            .nav2 .login-btn {
                background-color: #048a2f;
                color: #ffffff;
                border: none;
                width: 100%;
                padding: 10px;
                cursor: pointer;
                border-radius: 8px;
            }
            .nav2 .login-btn:hover {
                background-color: #137e0a;
                border-radius: 8px;
            }
            .nav3 {
                background-color: #45a2bb;
                padding: 10px;
            }
            .nav3 ul {
                list-style-type: none;
                padding: 0px;
                margin: 0px;
                display: flex;
                justify-content: space-around;
                align-items: center;
            }
            .nav3 a {
                text-decoration: none;
                color: #fff;
                display: block;
                padding: 10px;
            }
            .nav3 .dropdown-content {
                display: none;
            }
            .nav3 .dropdown:hover .dropdown-content {
                display: block;
                position: absolute;
                background-color: #3e3e3e;
                min-width: 150px;
            }
            .nav3 .dropdown-content a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="nav-container">
            <h2>Vertical Navbar CSS</h2>
            <nav class="nav2">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Products</a></li>
                </ul>
                <button class="login-btn">Login</button>
            </nav>
        </div>

        <div class="nav-container">
            <h2>Horizontal with Dropdown</h2>
            <nav class="nav3">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li class="dropdown">
                        <a href="#">About</a>
                        <div class="dropdown-content">
                            <a href="#">Our Story</a>
                            <a href="#">Team</a>
                            <a href="#">Contact</a>
                        </div>
                    </li>
                    <li><a href="#">Products</a></li>
                    <li><button class="login-btn">Login</button></li>
                </ul>
            </nav>
        </div>
    </body>
</html>
